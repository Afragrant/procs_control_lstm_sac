torchvision = ">=0.28.0, <0.29"
numpy = ">=2.5.2, <3"
torchrl = ">=0.13.3, <0.14"
gymnasium = ">=1.0.0, <2"
tensorboard = ">=2.18.0, <3"
pyyaml = ">=6.0, <7"
scipy = ">=1.14.0, <2"
