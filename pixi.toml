[workspace]
authors = ["afragrant <394451070@qq.com>"]
channels = ["conda-forge"]
name = "drl_control_procs"
platforms = [
    {"platform" = "linux-64", cuda="13.3"},
    {"platform" = "win-64", cuda="13.3"}
]
version = "0.1.0"

[tasks]
tensorboard = "tensorboard --logdir"


[dependencies]
python = "==3.12.13"


[pypi-dependencies]
pandas = ">=3.0.5, <4"
matplotlib = ">=3.10.0, <4"
