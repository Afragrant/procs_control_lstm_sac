env_seed: 1
vectorize: "SubprocVecEnv"
representation: "Recurrent_LSTM"

env_kwargs:
  speed_kmh: 200.0
  # 每回合在 [200, 300] km/h 均匀采样。评估 200/220/240/260/280/300。
  speed_range_kmh: [200.0, 300.0]
  dt_base: 1.0e-4
  control_freq: 100.0
  action_max: 50.0
  action_rate_weight: 0.01
  action_penalty_weight: 0.001
  wear_amplitude: 0.001
  wear_wavelength: 0.6
  irregularity: false
  # 0：不堆叠帧。历史放在各自的 LSTM 状态里。
  history_length: 0

# LSTM 宽度。层数在编码器里固定为 2。与 Recurrent SAC 相同，不沿用 Greedy SAC 的大 critic 学习率。
representation_hidden_size: [256]
actor_hidden_size: [256, 256]
critic_hidden_size: [256, 256]
activation: "relu"

seed: 1
parallels: 4
buffer_size: 200000
# 每次更新采样的连续片段条数，不是转移条数。不能和 Greedy SAC 的 batch_size=128 条转移比训练量。
batch_size: 128
# 学习段长度。短于 240 的回合从起点取整段再补齐。正式实验前先用短序列量过更新时间和显存。
sequence_length: 240
learning_rate_actor: 0.0003
learning_rate_critic: 0.0003
gamma: 0.99
# proposal 的熵系数。actor 和 critic 目标都不含熵，也不做自动熵调节。
alpha: 0.1
use_automatic_entropy_tuning: false
# 每个有效时间步从 proposal 抽 N 个动作，留下 Q 最高的 ceil(ρN) 个做最大似然。
cem_samples: 30
cem_rho: 0.2
tau: 0.005

training_frequency: 8
running_steps: 500000
start_training: 5000
n_epochs: 1

use_grad_clip: True
grad_clip_norm: 0.2
use_obsnorm: True
obsnorm_range: 5

device: "cuda:0"
test_mode: False
eval_interval: 25000
log_dir: "logs/recurrent_greedy_sac/"
model_dir: "models/recurrent_greedy_sac/"
