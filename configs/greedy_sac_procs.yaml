env_seed: 1
vectorize: "SubprocVecEnv"
representation: "History_MLP"

env_kwargs:
  speed_kmh: 200.0
  # 每回合在 [200, 300] km/h 均匀采样。评估 200/220/240/260/280/300。
  speed_range_kmh: [200.0, 300.0]
  dt_base: 1.0e-4
  control_freq: 100.0
  action_max: 50.0
  action_rate_weight: 0.01
  action_penalty_weight: 0.001
  wear_amplitude: 0.001
  wear_wavelength: 0.6
  irregularity: false
  history_length: 20
representation_hidden_size: [256]
actor_hidden_size: [256]
critic_hidden_size: [256]
activation: "relu"

seed: 1
parallels: 4
buffer_size: 200000
batch_size: 128
learning_rate_actor: 0.0003
learning_rate_critic: 0.0003
gamma: 0.995
# proposal 的熵系数 τ。actor 本身不做熵正则。
alpha: 0.01
use_automatic_entropy_tuning: False
# 每个状态从 proposal 抽 N 个动作，留下 Q 最高的 ceil(ρN) 个做最大似然。
cem_samples: 30
cem_rho: 0.1
tau: 0.005

# 每 8 个向量步（32 条转移）做一次 batch=128 更新：每条新数据 4 个梯度样本
training_frequency: 8
running_steps: 500000
start_training: 5000
n_epochs: 1

use_grad_clip: True
grad_clip_norm: 0.5
use_obsnorm: True
obsnorm_range: 5

device: "cuda:0"
test_mode: False
eval_interval: 25000
log_dir: "logs/greedy_sac/"
model_dir: "models/greedy_sac/"
