env_seed: 1
vectorize: "SubprocVecEnv"
representation: "History_LSTM"

env_kwargs:
  speed_kmh: 200.0
  # 每回合在 [200, 300] km/h 均匀采样。评估 200/220/240/260/280/300。
  speed_range_kmh: [200.0, 300.0]
  dt_base: 1.0e-4
  control_freq: 100.0
  action_max: 50.0
  action_rate_weight: 0.01
  action_penalty_weight: 0.001
  wear_amplitude: 0.001
  wear_wavelength: 0.6
  irregularity: false
  # 与 MLP 相同的 20 帧。LSTM 编码这个窗口，当前帧另直连到 actor 和 Q。
  history_length: 20

representation_hidden_size: [256]
actor_hidden_size: [256]
critic_hidden_size: [256]
activation: "relu"

seed: 1
parallels: 4
buffer_size: 200000
batch_size: 128
learning_rate_actor: 0.0003
learning_rate_critic: 0.0003
learning_rate_alpha: 0.0003
gamma: 0.99
alpha: 0.2
use_automatic_entropy_tuning: True
# 与 Recurrent-SAC 相同：1 维动作的 -action_dim。
target_entropy: -1
tau: 0.005

training_frequency: 8
running_steps: 500000
start_training: 5000
n_epochs: 1

use_grad_clip: True
grad_clip_norm: 0.2
use_obsnorm: True
obsnorm_range: 5

device: "cuda:0"
test_mode: False
eval_interval: 25000
log_dir: "logs/lstm_sac/"
model_dir: "models/lstm_sac/"
