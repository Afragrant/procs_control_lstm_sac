env_seed: 1
vectorize: "SubprocVecEnv"
representation: "History_MLP"

env_kwargs:
  speed_kmh: 250.0
  speed_range_kmh: [200.0, 250.0]
  control_freq: 100.0
  action_max: 50.0
  action_rate_weight: 0.01
  action_penalty_weight: 0.01
  wear_amplitude: 0.001
  wear_wavelength: 0.6
  irregularity: false
  history_length: 20
representation_hidden_size: [256]
actor_hidden_size: [256]
critic_hidden_size: [256]
activation: "relu"

seed: 1
parallels: 4
buffer_size: 200000
batch_size: 128
learning_rate_actor: 0.0003
learning_rate_critic: 0.0003
gamma: 0.995
alpha: 0.2
use_automatic_entropy_tuning: True
tau: 0.005

training_frequency: 1
running_steps: 1000000
start_training: 5000
n_epochs: 1

use_grad_clip: False
grad_clip_norm: 0.5
use_obsnorm: True
obsnorm_range: 5

device: "cuda:0"
test_mode: False
eval_interval: 25000
log_dir: "logs/mlp_sac/"
model_dir: "models/mlp_sac/"
